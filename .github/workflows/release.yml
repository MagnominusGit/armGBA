# The standalone app's AppImages and APK, built by Armulators' workflow when run by hand. Releases
# carry the files built locally, so publishing one doesn't run it.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    uses: MagnominusGit/Armulators/.github/workflows/app.yml@main
    with:
      release: ${{ github.event.release.tag_name }}
    secrets:
      keystore: ${{ secrets.APK_KEYSTORE }}
